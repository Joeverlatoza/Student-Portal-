<meta charset="utf-8">

<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
input,select,textarea{border:1px solid #cbd5e1;padding:.45rem .6rem;width:100%;background:#fff;font-size:14px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #1e3a8a;outline-offset:1px}

<script type="module">

// Supabase: Project Settings > API. Use the Project URL and the anon public key.
const SUPABASE_URL = "https://bwrlvygpfklzlperygro.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3cmx2eWdwZmtsemxwZXJ5Z3JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODk1NDgsImV4cCI6MjEwNzI2NTU0OH0.S8_gXxZNbbkbP8Wmeo3kB23ZP9b8I7o4OTIoKOj4iNg";

import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const SQL = `-- Run this whole script once in Supabase > SQL Editor.
-- Replace teacher@gmail.com with the teacher's Gmail address first.

create table teachers (email text primary key);
insert into teachers (email) values ('teacher@gmail.com');

create table profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  email text unique not null,
  name text not null,
  role text not null default 'student' check (role in ('student','teacher')),
  created_at timestamptz default now()
);

create table subjects (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  description text default '',
  created_at timestamptz default now()
);

create table posts (
  id uuid primary key default gen_random_uuid(),
  type text not null check (type in ('homework','quiz','reviewer','lesson')),
  subject_id uuid references subjects(id) on delete set null,
  title text not null,
  body text default '',
  link text default '',
  due date,
  questions jsonb,
  author text,
  created_at timestamptz default now()
);

create table grades (
  subject_id uuid references subjects(id) on delete cascade,
  student_id uuid references profiles(id) on delete cascade,
  q1 numeric check (q1 between 0 and 100),
  q2 numeric check (q2 between 0 and 100),
  q3 numeric check (q3 between 0 and 100),
  q4 numeric check (q4 between 0 and 100),
  primary key (subject_id, student_id)
);

create table submissions (
  post_id uuid references posts(id) on delete cascade,
  student_id uuid references profiles(id) on delete cascade,
  student_name text,
  student_email text,
  text text default '',
  link text default '',
  score numeric,
  total numeric,
  feedback text default '',
  submitted_at timestamptz default now(),
  primary key (post_id, student_id)
);

-- Helper: is the signed-in user a teacher?
create or replace function is_teacher() returns boolean
language sql security definer stable set search_path = public as $$
  select exists (select 1 from teachers where email = lower(auth.jwt() ->> 'email'))
$$;

-- Create a profile on first Google sign-in. Only Gmail addresses are allowed.
create or replace function handle_new_user() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if lower(new.email) not like '%@gmail.com' then
    raise exception 'Only Gmail accounts can register.';
  end if;
  insert into profiles (id, email, name, role)
  values (
    new.id,
    lower(new.email),
    coalesce(new.raw_user_meta_data ->> 'full_name', new.email),
    case when exists (select 1 from teachers where email = lower(new.email)) then 'teacher' else 'student' end
  );
  return new;
end $$;

create trigger on_auth_user_created after insert on auth.users
for each row execute function handle_new_user();

-- Students cannot change scores or feedback on their own submissions.
create or replace function protect_submission() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if not is_teacher() then
    new.score := old.score;
    new.total := old.total;
    new.feedback := old.feedback;
  end if;
  return new;
end $$;

create trigger protect_submission_scores before update on submissions
for each row execute function protect_submission();

-- Row level security
alter table teachers enable row level security;
alter table profiles enable row level security;
alter table subjects enable row level security;
alter table posts enable row level security;
alter table grades enable row level security;
alter table submissions enable row level security;

create policy "profiles read" on profiles for select to authenticated
  using (id = auth.uid() or is_teacher());

create policy "subjects read" on subjects for select to authenticated using (true);
create policy "subjects teacher write" on subjects for all to authenticated
  using (is_teacher()) with check (is_teacher());

create policy "posts read" on posts for select to authenticated using (true);
create policy "posts teacher write" on posts for all to authenticated
  using (is_teacher()) with check (is_teacher());

create policy "grades read" on grades for select to authenticated
  using (student_id = auth.uid() or is_teacher());
create policy "grades teacher write" on grades for all to authenticated
  using (is_teacher()) with check (is_teacher());

create policy "submissions read" on submissions for select to authenticated
  using (student_id = auth.uid() or is_teacher());
create policy "submissions insert" on submissions for insert to authenticated
  with check (student_id = auth.uid());
create policy "submissions update" on submissions for update to authenticated
  using (student_id = auth.uid() or is_teacher())
  with check (student_id = auth.uid() or is_teacher());

-- Live updates across devices
alter publication supabase_realtime add table subjects, posts, grades, submissions;
`;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = {user:null, role:null, view:"", subjects:[], posts:[], grades:[], subs:[], users:[], fType:"all", fSub:"all", ledger:""};
const SETUP_NEEDED = SUPABASE_URL.startsWith("PASTE");
const TYPES = {homework:"Homework", quiz:"Quiz", reviewer:"Study Reviewer", lesson:"Lesson"};
const sb = SETUP_NEEDED ? null : createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let realtimeOn = false;

function toast(m, bad) {
  const t = $("toast");
  t.innerHTML = `<div class="px-4 py-2 text-sm text-white ${bad ? "bg-red-700" : "bg-slate-800"}">${esc(m)}</div>`;
  setTimeout(() => t.innerHTML = "", 3500);
}
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"}) : "No due date";
const fmtTs = t => t ? new Date(t).toLocaleString() : "";
const num = v => v === undefined || v === null || v === "" || isNaN(v) ? null : Number(v);
function avg(g) {
  if (!g) return null;
  const v = ["q1","q2","q3","q4"].map(k => num(g[k])).filter(x => x !== null);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function standing(a) {
  if (a === null) return "No grades recorded";
  if (a >= 90) return "Outstanding";
  if (a >= 85) return "Very Satisfactory";
  if (a >= 80) return "Satisfactory";
  if (a >= 75) return "Fairly Satisfactory";
  return "Did Not Meet Expectations";
}
const f1 = a => a === null ? "-" : a.toFixed(2);

/* ---------- Setup and login screens ---------- */
function showSetup() {
  $("app").innerHTML = `<div class="max-w-3xl mx-auto p-6"><div class="box">
<h1 class="text-xl font-bold">Portal setup required</h1>
<ol class="list-decimal ml-5 mt-3 text-sm space-y-1">
<li>Create a project at supabase.com and wait for it to finish provisioning.</li>
<li>Project Settings > API: copy the Project URL and the anon public key into this file.</li>
<li>SQL Editor > New query: paste the script below, change the teacher email, and click Run.</li>
<li>Authentication > Providers > Google: switch it on. Follow the steps shown there to create a Google OAuth client ID and secret, and paste them in. Copy the callback URL it shows.</li>
<li>In Google Cloud Console, open your OAuth client and add that callback URL under Authorized redirect URIs.</li>
<li>Host this file at an https address (Netlify Drop is free).</li>
<li>Authentication > URL Configuration: set Site URL to the hosted address, and add the same address under Redirect URLs.</li>
</ol>
<pre class="mt-3 p-3 bg-slate-100 border border-slate-300 text-xs overflow-x-auto">${esc(SQL)}</pre></div></div>`;
}

function showLogin(msg) {
  $("app").innerHTML = `<div class="min-h-screen flex items-center justify-center p-4"><div class="box w-full max-w-sm">
<div class="border-b border-slate-300 pb-3 mb-4"><div class="text-lg font-bold">${esc(SCHOOL_NAME)}</div><div class="text-sm text-slate-600">Student and Teacher Access</div></div>
${msg ? `<div class="mb-3 p-2 text-sm bg-red-50 border border-red-300 text-red-800">${esc(msg)}</div>` : ""}
<p class="text-sm text-slate-700 mb-3">Sign in with your Gmail address and a password. New here? Choose Create account. Each Gmail address has exactly one account.</p>
<label class="lbl !mt-0">Gmail address</label><input id="em" type="email" autocomplete="email" placeholder="you@gmail.com">
<label class="lbl">Password (at least 6 characters)</label><input id="pw" type="password" autocomplete="current-password">
<button class="btn w-full mt-4" onclick="A.login()">Sign in</button>
<button class="btn2 w-full mt-2" onclick="A.signup()">Create account</button></div></div>`;
}

/* ---------- Auth and data ---------- */
async function boot() {
  if (SETUP_NEEDED) return showSetup();
  sb.auth.onAuthStateChange(async (_event, session) => {
    if (!session) { S.user = null; showLogin(); return; }
    const {data: p} = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (!p) {
      await sb.auth.signOut();
      showLogin("This account cannot be used. Only Gmail accounts can register.");
      return;
    }
    S.user = {id: p.id, email: p.email, name: p.name};
    S.role = p.role;
    S.view = S.role === "teacher" ? "subjects" : "home";
    await loadAll();
    if (!realtimeOn) {
      realtimeOn = true;
      sb.channel("portal").on("postgres_changes", {event: "*", schema: "public"}, () => loadAll()).subscribe();
    }
  });
}

async function loadAll() {
  if (!S.user) return;
  const teacher = S.role === "teacher";
  const [subj, posts, grades, subs, users] = await Promise.all([
    sb.from("subjects").select("*").order("name"),
    sb.from("posts").select("*").order("created_at", {ascending: false}),
    sb.from("grades").select("*"),
    sb.from("submissions").select("*"),
    teacher ? sb.from("profiles").select("id,name,email,role").eq("role", "student").order("name") : Promise.resolve({data: []})
  ]);
  const err = [subj, posts, grades, subs, users].find(r => r.error);
  if (err) toast("Data error: " + err.error.message, true);
  S.subjects = subj.data || [];
  S.posts = posts.data || [];
  S.grades = grades.data || [];
  S.subs = subs.data || [];
  S.users = users.data || [];
  render();
}

/* ---------- Layout ---------- */
const NAV = {
  student: [["home","Dashboard"], ["grades","Academic Record"], ["learn","Learning Center"]],
  teacher: [["subjects","Subjects"], ["publish","Publish Material"], ["materials","Published Materials"], ["ledger","Grade Ledger"], ["subs","Submissions"]]
};

function render(force) {
  if (!S.user) return;
  const a = document.activeElement;
  if (!force && a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $("main") && $("main").contains(a)) return;
  if (!force && S.view === "publish" && $("main")) return;
  const nav = NAV[S.role].map(([k, l]) => `<button onclick="A.go('${k}')" class="px-3 py-3 text-sm font-semibold border-b-2 ${S.view === k ? "border-white text-white" : "border-transparent text-slate-300 hover:text-white"}">${l}</button>`).join("");
  const views = {home: vHome, grades: vGrades, learn: vLearn, subjects: vSubjects, publish: vPublish, materials: vMaterials, ledger: vLedger, subs: vSubs};
  $("app").innerHTML = `<header class="bg-slate-900 text-white"><div class="max-w-6xl mx-auto px-4 flex flex-wrap items-center justify-between gap-2 pt-3">
<div><div class="font-bold">${esc(SCHOOL_NAME)}</div><div class="text-xs text-slate-300">${S.role === "teacher" ? "Teacher Management View" : "Student View"}: ${esc(S.user.name)} (${esc(S.user.email)})</div></div>
<button class="btn2 !text-slate-900" onclick="A.logout()">Sign out</button></div>
<nav class="max-w-6xl mx-auto px-4 flex flex-wrap gap-1">${nav}</nav></header>
<main id="main" class="max-w-6xl mx-auto p-4">${views[S.view]()}</main>`;
}

const subName = id => (S.subjects.find(s => s.id === id) || {}).name || "Unknown subject";
const mySub = pid => S.subs.find(s => s.post_id === pid && s.student_id === S.user.id);
const gradeOf = (sid, uid) => S.grades.find(g => g.subject_id === sid && g.student_id === uid);
const h2 = t => `<h2 class="text-lg font-bold mb-3">${t}</h2>`;
const empty = t => `<div class="box text-sm text-slate-600">${t}</div>`;

/* ---------- Student views ---------- */
function vHome() {
  const subs = S.subjects.slice().sort((a, b) => a.name.localeCompare(b.name));
  const open = S.posts.filter(p => (p.type === "homework" || p.type === "quiz") && !mySub(p.id)).sort((a, b) => (a.due || "9").localeCompare(b.due || "9"));
  const avgs = subs.map(s => avg(gradeOf(s.id, S.user.id))).filter(x => x !== null);
  const ga = avgs.length ? avgs.reduce((a, b) => a + b, 0) / avgs.length : null;
  return `<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
<div class="box"><div class="text-xs text-slate-600">General average</div><div class="text-2xl font-bold">${f1(ga)}</div></div>
<div class="box"><div class="text-xs text-slate-600">Academic standing</div><div class="text-base font-bold mt-1">${standing(ga)}</div></div>
<div class="box"><div class="text-xs text-slate-600">Pending homework and quizzes</div><div class="text-2xl font-bold">${open.length}</div></div></div>
${h2("Enrolled subjects")}
${subs.length ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-5">${subs.map(s => `<div class="box"><div class="font-bold">${esc(s.name)}</div><div class="text-sm text-slate-600 mb-2">${esc(s.description || "")}</div><div class="text-sm">Average: <b>${f1(avg(gradeOf(s.id, S.user.id)))}</b></div><div class="text-sm">Materials: ${S.posts.filter(p => p.subject_id === s.id).length}</div><button class="btn2 mt-2" onclick="A.openSubject('${s.id}')">View materials</button></div>`).join("")}</div>` : empty("No subjects have been created yet. Your teacher will add them.")}
${h2("Upcoming work")}
${open.length ? `<div class="box p-0 overflow-x-auto"><table class="w-full"><tr><th class="th">Title</th><th class="th">Type</th><th class="th">Subject</th><th class="th">Due</th><th class="th"></th></tr>${open.map(p => `<tr><td class="td">${esc(p.title)}</td><td class="td">${TYPES[p.type]}</td><td class="td">${esc(subName(p.subject_id))}</td><td class="td">${fmtDate(p.due)}</td><td class="td"><button class="btn2" onclick="A.open('${p.id}')">Open</button></td></tr>`).join("")}</table></div>` : empty("No pending work.")}`;
}

function vGrades() {
  const subs = S.subjects.slice().sort((a, b) => a.name.localeCompare(b.name));
  const avgs = [];
  const rows = subs.map(s => {
    const g = gradeOf(s.id, S.user.id), a = avg(g);
    if (a !== null) avgs.push(a);
    return `<tr><td class="td font-semibold">${esc(s.name)}</td>${["q1","q2","q3","q4"].map(k => `<td class="td">${g && num(g[k]) !== null ? g[k] : "-"}</td>`).join("")}<td class="td font-semibold">${f1(a)}</td><td class="td">${a === null ? "" : a >= 75 ? "Passed" : "Below passing"}</td></tr>`;
  }).join("");
  const ga = avgs.length ? avgs.reduce((a, b) => a + b, 0) / avgs.length : null;
  return `${h2("Academic record")}<div class="box p-0 overflow-x-auto"><table class="w-full"><tr><th class="th">Subject</th><th class="th">Quarter 1</th><th class="th">Quarter 2</th><th class="th">Quarter 3</th><th class="th">Quarter 4</th><th class="th">Average</th><th class="th">Remarks</th></tr>${rows || `<tr><td class="td" colspan="7">No subjects yet.</td></tr>`}
<tr class="bg-slate-50"><td class="td font-bold" colspan="5">General average</td><td class="td font-bold">${f1(ga)}</td><td class="td font-bold">${standing(ga)}</td></tr></table></div>
<p class="text-xs text-slate-600 mt-2">Passing grade is 75. Grades are entered by your teacher.</p>`;
}

function vLearn() {
  const list = S.posts.filter(p => (S.fType === "all" || p.type === S.fType) && (S.fSub === "all" || p.subject_id === S.fSub));
  return `${h2("Learning center")}<div class="grid grid-cols-2 gap-3 mb-3 max-w-lg">
<div><label class="lbl">Type</label><select onchange="A.f('fType',this.value)"><option value="all">All types</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${S.fType === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
<div><label class="lbl">Subject</label><select onchange="A.f('fSub',this.value)"><option value="all">All subjects</option>${S.subjects.map(s => `<option value="${s.id}" ${S.fSub === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div></div>
${list.length ? `<div class="box p-0 overflow-x-auto"><table class="w-full"><tr><th class="th">Title</th><th class="th">Type</th><th class="th">Subject</th><th class="th">Due</th><th class="th">Status</th><th class="th"></th></tr>${list.map(p => {
    const s = mySub(p.id), gradable = p.type === "homework" || p.type === "quiz";
    const status = !gradable ? "Available" : s ? (s.score != null ? "Scored " + s.score + " of " + s.total : "Submitted") : "Not submitted";
    return `<tr><td class="td">${esc(p.title)}</td><td class="td"><span class="tag">${TYPES[p.type]}</span></td><td class="td">${esc(subName(p.subject_id))}</td><td class="td">${gradable ? fmtDate(p.due) : "-"}</td><td class="td">${status}</td><td class="td"><button class="btn2" onclick="A.open('${p.id}')">Open</button></td></tr>`;
  }).join("")}</table></div>` : empty("No materials match the selected filters.")}`;
}

/* ---------- Teacher views ---------- */
function vSubjects() {
  return `${h2("Subjects")}<div class="box mb-4 max-w-xl"><label class="lbl !mt-0">Subject name</label><input id="sn" placeholder="General Mathematics"><label class="lbl">Description</label><input id="sd" placeholder="Optional short description"><button class="btn mt-3" onclick="A.addSubject()">Add subject</button></div>
${S.subjects.length ? `<div class="box p-0 overflow-x-auto"><table class="w-full"><tr><th class="th">Subject</th><th class="th">Description</th><th class="th">Materials</th><th class="th"></th></tr>${S.subjects.map(s => `<tr><td class="td font-semibold">${esc(s.name)}</td><td class="td">${esc(s.description || "")}</td><td class="td">${S.posts.filter(p => p.subject_id === s.id).length}</td><td class="td"><button class="btn2" onclick="A.delSubject('${s.id}')">Delete</button></td></tr>`).join("")}</table></div>` : empty("No subjects yet. Add the first subject above.")}`;
}

function qBlock() {
  return `<div class="qb border border-slate-300 p-3 mt-3 bg-slate-50"><label class="lbl !mt-0">Question</label><input class="qt"><div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">${"ABCD".split("").map(l => `<input class="qo" placeholder="Option ${l}">`).join("")}</div><div class="grid grid-cols-2 gap-2 mt-2"><div><label class="lbl !mt-0">Correct option</label><select class="qc"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div><label class="lbl !mt-0">Points</label><input class="qp" type="number" min="1" value="1"></div></div><button class="btn2 mt-2" onclick="this.closest('.qb').remove()">Remove question</button></div>`;
}

function vPublish() {
  return `${h2("Publish material")}<div class="box max-w-2xl">
<label class="lbl !mt-0">Type</label><select id="pt" onchange="A.typeChange()">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
<label class="lbl">Subject</label><select id="ps">${S.subjects.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
<label class="lbl">Title</label><input id="ptitle">
<div id="dueW"><label class="lbl">Due date</label><input id="pdue" type="date"></div>
<label class="lbl" id="bodyL">Instructions</label><textarea id="pbody" rows="5"></textarea>
<div id="linkW"><label class="lbl">Resource link (optional, for example a Google Drive share link)</label><input id="plink" placeholder="https://"></div>
<div id="quizW" class="hidden"><div id="qs">${qBlock()}</div><button class="btn2 mt-3" onclick="document.getElementById('qs').insertAdjacentHTML('beforeend',A.qBlock())">Add question</button></div>
<button class="btn mt-4" onclick="A.publish()">Publish</button></div>`;
}

function vMaterials() {
  return `${h2("Published materials")}${S.posts.length ? `<div class="box p-0 overflow-x-auto"><table class="w-full"><tr><th class="th">Title</th><th class="th">Type</th><th class="th">Subject</th><th class="th">Due</th><th class="th">Published</th><th class="th"></th></tr>${S.posts.map(p => `<tr><td class="td">${esc(p.title)}</td><td class="td">${TYPES[p.type]}</td><td class="td">${esc(subName(p.subject_id))}</td><td class="td">${p.type === "homework" || p.type === "quiz" ? fmtDate(p.due) : "-"}</td><td class="td">${fmtTs(p.created_at)}</td><td class="td"><button class="btn2" onclick="A.delPost('${p.id}')">Delete</button></td></tr>`).join("")}</table></div>` : empty("Nothing published yet.")}`;
}

function vLedger() {
  const sid = S.ledger && S.subjects.some(s => s.id === S.ledger) ? S.ledger : (S.subjects[0] || {}).id || "";
  const head = `${h2("Grade ledger")}<div class="max-w-sm mb-3"><label class="lbl !mt-0">Subject</label><select onchange="A.f('ledger',this.value)">${S.subjects.map(s => `<option value="${s.id}" ${s.id === sid ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>`;
  if (!S.subjects.length) return head + empty("Create a subject first.");
  if (!S.users.length) return head + empty("No students have signed in yet. Students appear here after their first Google sign-in.");
  return head + `<div class="box p-0 overflow-x-auto"><table class="w-full"><tr><th class="th">Student</th><th class="th">Quarter 1</th><th class="th">Quarter 2</th><th class="th">Quarter 3</th><th class="th">Quarter 4</th><th class="th">Average</th><th class="th"></th></tr>${S.users.map(u => {
    const g = gradeOf(sid, u.id) || {};
    return `<tr data-uid="${u.id}"><td class="td"><div class="font-semibold">${esc(u.name)}</div><div class="text-xs text-slate-600">${esc(u.email)}</div></td>${["q1","q2","q3","q4"].map(k => `<td class="td"><input data-k="${k}" type="number" min="0" max="100" step="0.01" value="${g[k] ?? ""}" style="width:90px"></td>`).join("")}<td class="td font-semibold">${f1(avg(g))}</td><td class="td"><button class="btn" onclick="A.saveGrade(this,'${sid}')">Save</button></td></tr>`;
  }).join("")}</table></div>`;
}

function vSubs() {
  const l = S.subs.slice().sort((a, b) => (b.submitted_at || "").localeCompare(a.submitted_at || ""));
  return `${h2("Student submissions")}${l.length ? `<div class="box p-0 overflow-x-auto"><table class="w-full"><tr><th class="th">Student</th><th class="th">Material</th><th class="th">Submitted</th><th class="th">Response</th><th class="th">Score and feedback</th></tr>${l.map(s => {
    const p = S.posts.find(x => x.id === s.post_id) || {};
    const quiz = p.type === "quiz";
    return `<tr><td class="td">${esc(s.student_name)}<div class="text-xs text-slate-600">${esc(s.student_email)}</div></td><td class="td">${esc(p.title || "Removed")}<div class="text-xs text-slate-600">${TYPES[p.type] || ""}</div></td><td class="td">${fmtTs(s.submitted_at)}</td><td class="td" style="max-width:260px">${quiz ? "Auto-graded quiz" : `<div class="whitespace-pre-wrap">${esc(s.text || "")}</div>${s.link ? `<a class="text-blue-800 underline break-all" target="_blank" rel="noopener" href="${esc(s.link)}">${esc(s.link)}</a>` : ""}`}</td><td class="td">${quiz ? `Score ${s.score} of ${s.total}` : `<div id="g_${s.post_id}_${s.student_id}"><input data-s type="number" min="0" placeholder="Score" value="${s.score ?? ""}" style="width:100px"><input data-f class="mt-1" placeholder="Feedback" value="${esc(s.feedback || "")}"><button class="btn mt-1" onclick="A.gradeSub('${s.post_id}','${s.student_id}')">Save</button></div>`}</td></tr>`;
  }).join("")}</table></div>` : empty("No submissions yet.")}`;
}

/* ---------- Actions ---------- */
const A = window.A = {
  qBlock,
  async login() {
    const email = $("em").value.trim().toLowerCase(), password = $("pw").value;
    if (!email || !password) return toast("Enter your email and password.", true);
    const {error} = await sb.auth.signInWithPassword({email, password});
    if (error) toast(error.message === "Invalid login credentials" ? "Wrong email or password, or the account does not exist yet." : error.message, true);
  },
  async signup() {
    const email = $("em").value.trim().toLowerCase(), password = $("pw").value;
    if (!email.endsWith("@gmail.com")) return toast("Use a Gmail address (ending in @gmail.com).", true);
    if (password.length < 6) return toast("Password must be at least 6 characters.", true);
    const {data, error} = await sb.auth.signUp({email, password});
    if (error) return toast(error.message, true);
    if (!data.session) toast("Account created, but Supabase still requires email confirmation. Turn off Confirm email in Supabase, then sign in.", true);
  },
  async logout() { await sb.auth.signOut(); },
  go(v) { S.view = v; render(true); },
  f(k, v) { S[k] = v; render(true); },
  openSubject(id) { S.fSub = id; S.fType = "all"; S.view = "learn"; render(true); },
  typeChange() {
    const t = $("pt").value;
    $("dueW").classList.toggle("hidden", !(t === "homework" || t === "quiz"));
    $("quizW").classList.toggle("hidden", t !== "quiz");
    $("linkW").classList.toggle("hidden", t === "quiz");
    $("bodyL").textContent = t === "homework" ? "Instructions" : t === "quiz" ? "Quiz instructions" : t === "reviewer" ? "Summary or reviewer text" : "Lesson notes";
  },
  async addSubject() {
    const name = $("sn").value.trim();
    if (!name) return toast("Enter a subject name.", true);
    const {error} = await sb.from("subjects").insert({name, description: $("sd").value.trim()});
    if (error) return toast(error.message, true);
    toast("Subject added.");
  },
  async delSubject(id) {
    if (!confirm("Delete this subject? Its grades and materials will be removed.")) return;
    const {error} = await sb.from("subjects").delete().eq("id", id);
    if (error) toast(error.message, true);
  },
  async publish() {
    const type = $("pt").value, subject_id = $("ps").value, title = $("ptitle").value.trim(), body = $("pbody").value.trim();
    if (!subject_id) return toast("Create a subject first.", true);
    if (!title) return toast("Enter a title.", true);
    const row = {
      type, subject_id, title, body,
      link: type === "quiz" ? "" : $("plink").value.trim(),
      due: (type === "homework" || type === "quiz") && $("pdue").value ? $("pdue").value : null,
      author: S.user.email
    };
    if (type === "quiz") {
      row.questions = [...document.querySelectorAll(".qb")].map(b => ({
        q: b.querySelector(".qt").value.trim(),
        opts: [...b.querySelectorAll(".qo")].map(i => i.value.trim()),
        correct: +b.querySelector(".qc").value,
        points: Math.max(1, +b.querySelector(".qp").value || 1)
      }));
      if (!row.questions.length || row.questions.some(q => !q.q || q.opts.some(o => !o)))
        return toast("Complete every question and all four options.", true);
    }
    const {error} = await sb.from("posts").insert(row);
    if (error) return toast(error.message, true);
    toast("Published.");
    S.view = "materials";
    render(true);
  },
  async delPost(id) {
    if (!confirm("Delete this material?")) return;
    const {error} = await sb.from("posts").delete().eq("id", id);
    if (error) toast(error.message, true);
  },
  async saveGrade(btn, sid) {
    const tr = btn.closest("tr"), uid = tr.dataset.uid, row = {subject_id: sid, student_id: uid};
    for (const i of tr.querySelectorAll("input")) {
      const v = i.value.trim();
      if (v !== "" && (isNaN(v) || v < 0 || v > 100)) return toast("Grades must be between 0 and 100.", true);
      row[i.dataset.k] = v === "" ? null : Number(v);
    }
    const {error} = await sb.from("grades").upsert(row, {onConflict: "subject_id,student_id"});
    if (error) return toast(error.message, true);
    toast("Grades saved.");
  },
  async gradeSub(pid, uid) {
    const w = $(`g_${pid}_${uid}`), s = w.querySelector("[data-s]").value;
    const {error} = await sb.from("submissions").update({
      score: s === "" ? null : Number(s),
      feedback: w.querySelector("[data-f]").value.trim()
    }).eq("post_id", pid).eq("student_id", uid);
    if (error) return toast(error.message, true);
    toast("Score saved.");
  },
  open(id) {
    const p = S.posts.find(x => x.id === id);
    if (!p) return;
    const s = mySub(id), gr = p.type === "homework" || p.type === "quiz";
    let b = `<div class="text-sm text-slate-600 mb-2">${TYPES[p.type]} | ${esc(subName(p.subject_id))}${gr ? " | Due: " + fmtDate(p.due) : ""}</div>`;
    if (p.body) b += `<div class="whitespace-pre-wrap text-sm mb-3">${esc(p.body)}</div>`;
    if (p.link) b += `<a class="text-blue-800 underline text-sm break-all" target="_blank" rel="noopener" href="${esc(p.link)}">Open resource</a>`;
    if (p.type === "homework") {
      b += `<label class="lbl">Your response</label><textarea id="st" rows="5">${esc(s?.text || "")}</textarea><label class="lbl">Link to your file (optional)</label><input id="sl" value="${esc(s?.link || "")}" placeholder="https://">
${s ? `<div class="text-sm mt-2">Submitted ${fmtTs(s.submitted_at)}${s.score != null ? ". Score: <b>" + s.score + "</b>" : ""}${s.feedback ? "<br>Feedback: " + esc(s.feedback) : ""}</div>` : ""}
<button class="btn mt-3" onclick="A.submitHw('${id}')">${s ? "Update submission" : "Submit homework"}</button>`;
    }
    if (p.type === "quiz") {
      const tot = p.questions.reduce((a, q) => a + q.points, 0);
      if (s) b += `<div class="box mt-3"><b>Score: ${s.score} of ${s.total}</b><div class="text-sm">Submitted ${fmtTs(s.submitted_at)}. Each quiz can be taken once.</div></div>`;
      else b += p.questions.map((q, i) => `<div class="border border-slate-300 p-3 mt-3"><div class="font-semibold text-sm">${i + 1}. ${esc(q.q)} (${q.points} pt${q.points > 1 ? "s" : ""})</div>${q.opts.map((o, j) => `<label class="flex gap-2 items-start text-sm mt-1"><input type="radio" name="q${i}" value="${j}" style="width:auto;margin-top:3px">${esc(o)}</label>`).join("")}</div>`).join("") + `<div class="text-sm mt-2">Total points: ${tot}</div><button class="btn mt-3" onclick="A.submitQuiz('${id}')">Submit quiz</button>`;
    }
    $("modal").innerHTML = `<div class="fixed inset-0 bg-slate-900/60 z-40 flex items-start justify-center overflow-y-auto p-4"><div class="bg-white border border-slate-400 w-full max-w-2xl p-5 mt-6"><div class="flex justify-between items-start gap-3 mb-2"><h3 class="text-lg font-bold">${esc(p.title)}</h3><button class="btn2" onclick="A.close()">Close</button></div>${b}</div></div>`;
  },
  close() { $("modal").innerHTML = ""; },
  async submitHw(pid) {
    const text = $("st").value.trim(), link = $("sl").value.trim();
    if (!text && !link) return toast("Add a response or a link.", true);
    const {error} = await sb.from("submissions").upsert({
      post_id: pid, student_id: S.user.id, student_name: S.user.name, student_email: S.user.email,
      text, link, submitted_at: new Date().toISOString()
    }, {onConflict: "post_id,student_id"});
    if (error) return toast("Submission failed: " + error.message, true);
    toast("Homework submitted.");
    A.close();
  },
  async submitQuiz(pid) {
    const p = S.posts.find(x => x.id === pid);
    let score = 0, total = 0;
    for (let i = 0; i < p.questions.length; i++) {
      const r = document.querySelector(`input[name=q${i}]:checked`);
      if (!r) return toast("Answer every question before submitting.", true);
      const q = p.questions[i];
      total += q.points;
      if (+r.value === q.correct) score += q.points;
    }
    const {error} = await sb.from("submissions").insert({
      post_id: pid, student_id: S.user.id, student_name: S.user.name, student_email: S.user.email,
      score, total, submitted_at: new Date().toISOString()
    });
    if (error) return toast("Submission failed: " + error.message, true);
    toast("Quiz submitted.");
    A.close();
  }
};

boot();
</script>
</body>
</html>
